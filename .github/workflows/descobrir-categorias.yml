name: Descobrir categorias do Mercado Livre

# Só roda quando a gente aperta o botão. Não mexe no site — só investiga
# a árvore de categorias e mostra o resultado no resumo da rodada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mapear a árvore
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python scripts/descobrir_categorias.py

      # o refresh_token do ML é de uso único: guarda o novo, senão
      # a automação diária quebra amanhã
      - name: Guardar o refresh_token novo
        if: hashFiles('novo_refresh.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          gh secret set ML_REFRESH_TOKEN --body "$(cat novo_refresh.txt)" \
            --repo "${{ github.repository }}"
          rm -f novo_refresh.txt
