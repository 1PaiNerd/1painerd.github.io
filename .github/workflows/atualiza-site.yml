name: Atualiza o site (preços + vídeos)

# Todo dia às 12:10 UTC (09:10 em Brasília). Minuto quebrado de propósito:
# no minuto cheio a fila do GitHub fica cheia e atrasa.
on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:        # botão "Run workflow" pra rodar na hora

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vídeos dos canais (YouTube RSS)
        run: python scripts/coletar_videos.py

      - name: Preços dos achadinhos
        continue-on-error: true          # se a coleta de preço falhar, os vídeos ainda sobem
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          AMZ_ACCESS_KEY: ${{ secrets.AMZ_ACCESS_KEY }}
          AMZ_SECRET_KEY: ${{ secrets.AMZ_SECRET_KEY }}
          AMZ_PARTNER_TAG: ${{ secrets.AMZ_PARTNER_TAG }}
        run: python scripts/coletar_precos.py

      - name: Mais Vendidos do Mercado Livre
        continue-on-error: true          # se o ML cair, o resto do site ainda sobe
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python scripts/coletar_ml_mais_vendidos.py

      # O refresh_token do ML é de USO ÚNICO: cada renovação devolve um novo.
      # Aqui a gente guarda o novo no cofre, senão amanhã a automação morre.
      - name: Guardar o refresh_token novo
        continue-on-error: true
        if: hashFiles('novo_refresh.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          gh secret set ML_REFRESH_TOKEN --body "$(cat novo_refresh.txt)" \
            --repo "${{ github.repository }}"
          rm -f novo_refresh.txt          # nunca comitar token: o repo é público

      - name: Publicar
        run: |
          git config user.name  "1painerd-bot"
          git config user.email "actions@github.com"
          rm -f novo_refresh.txt
          # sem_link_ml.txt = produtos que entraram hoje e ainda não rendem
          # comissão. Fica publicado pra abrir direto no navegador e colar
          # no Gerador. links_afiliados.json NUNCA entra aqui: quem escreve
          # nele é o Patrick, não o robô.
          git add -A videos.json precos.json ml_mais_vendidos.json historico_ml.json sem_link_ml.txt alertas.json alerta_titulo.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "site: atualização de $(date +%F)"
          git push

      - name: Avisar quando algo bater o menor preço
        if: hashFiles('alerta_titulo.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO=$(cat alerta_titulo.txt)
          if [ -n "$TITULO" ]; then
            gh issue create --title "$TITULO" --body-file alertas.json || true
          fi
